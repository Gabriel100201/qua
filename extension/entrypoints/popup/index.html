<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>QUA</title>
    <style>
      body {
        width: 320px;
        margin: 0;
        padding: 12px;
        font: 13px/1.4 system-ui, sans-serif;
        color: #18181b;
        background: #fafafa;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 8px;
      }
      #qua-status {
        font-weight: 600;
      }
      #qua-duration {
        font-variant-numeric: tabular-nums;
        color: #52525b;
      }
      .qua-actions {
        display: flex;
        gap: 8px;
        margin-bottom: 8px;
      }
      button {
        flex: 1;
        padding: 6px 10px;
        border: 1px solid #d4d4d8;
        border-radius: 6px;
        background: #fff;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      .qua-meta {
        display: flex;
        justify-content: space-between;
        color: #52525b;
        margin-bottom: 8px;
      }
      #qua-transcript {
        height: 160px;
        overflow-y: auto;
        border: 1px solid #e4e4e7;
        border-radius: 6px;
        padding: 6px 8px;
        background: #fff;
      }
      .qua-transcript-line {
        padding: 2px 0;
        border-bottom: 1px solid #f4f4f5;
      }
      #qua-connect-title {
        font-weight: 600;
        margin: 0 0 2px;
      }
      #qua-connect-message {
        color: #52525b;
        margin: 0 0 14px;
      }
      #qua-connect-command-row {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 10px;
      }
      #qua-connect-command {
        flex: 1;
        display: block;
        padding: 6px 8px;
        background: #f4f4f5;
        border: 1px solid #e4e4e7;
        border-radius: 6px;
        font: 12px/1.4 ui-monospace, monospace;
        overflow-x: auto;
        white-space: nowrap;
      }
      #qua-connect-copy {
        flex: none;
        width: auto;
      }
    </style>
  </head>
  <body>
    <div id="qua-connect" hidden>
      <p id="qua-connect-title">Sin conectar al daemon</p>
      <p id="qua-connect-message">Un click para emparejar esta extensión con el daemon local.</p>
      <div id="qua-connect-command-row" hidden>
        <code id="qua-connect-command"></code>
        <button id="qua-connect-copy" type="button">Copiar</button>
      </div>
      <div class="qua-actions">
        <button id="qua-connect-button" type="button">Conectar</button>
        <button id="qua-connect-options" type="button" hidden>Abrir opciones</button>
      </div>
    </div>
    <div id="qua-main" hidden>
      <header>
        <span id="qua-status">Inactivo</span>
        <span id="qua-duration">00:00</span>
      </header>
      <div class="qua-actions">
        <button id="qua-toggle" type="button">Grabar</button>
        <button id="qua-mark" type="button" disabled>Marcar</button>
      </div>
      <div class="qua-meta">
        <span>Eventos: <span id="qua-events-count">0</span></span>
      </div>
      <div id="qua-transcript"></div>
    </div>
    <script type="module" src="./index.ts"></script>
  </body>
</html>

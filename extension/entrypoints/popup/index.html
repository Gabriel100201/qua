<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>QUA</title>
  </head>
  <body>
    <!-- Diseño 2026-10 (Penpot "QUA" → Popup). El anillo cuenta el estado y es el botón. -->
    <main id="view-main">
      <header class="bar">
        <span id="place" class="place"></span>
        <div class="glyphs">
          <button id="open-history" class="glyph is-plain" type="button" title="Sesiones anteriores" aria-label="Sesiones anteriores"></button>
          <span id="g-mic" class="glyph" role="img"></span>
          <span id="g-engine" class="glyph" role="img"></span>
          <span id="g-tab" class="glyph" role="img"></span>
        </div>
      </header>
      <button id="ring" class="ring" type="button"></button>
      <p id="reading" class="reading qua-num"></p>
      <p id="caption" class="caption"></p>
      <div id="controls" class="controls"></div>
      <p id="error" class="error" role="alert" hidden></p>
    </main>

    <main id="view-history" hidden>
      <header class="bar">
        <button id="close-history" class="glyph is-plain" type="button" aria-label="Volver"></button>
        <span class="title">Sesiones</span>
        <button id="open-settings" class="glyph is-plain" type="button" aria-label="Ajustes" title="Ajustes"></button>
      </header>
      <ul id="history" class="history"></ul>
      <p class="foot">Se guardan en tu navegador. Las borrás desde Ajustes.</p>
    </main>
    <script type="module" src="./index.ts"></script>
  </body>
</html>

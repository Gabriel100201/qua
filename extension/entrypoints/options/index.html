<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>QUA — configuración</title>
    <style>
      body {
        max-width: 480px;
        margin: 32px auto;
        padding: 0 16px;
        font: 14px/1.5 system-ui, sans-serif;
        color: #18181b;
      }
      h1 {
        font-size: 18px;
      }
      section {
        border: 1px solid #e4e4e7;
        border-radius: 8px;
        padding: 16px;
        margin-bottom: 16px;
      }
      h2 {
        font-size: 14px;
        margin: 0 0 8px;
      }
      p.qua-hint {
        color: #52525b;
        margin: 0 0 12px;
      }
      button {
        padding: 6px 14px;
        border: 1px solid #d4d4d8;
        border-radius: 6px;
        background: #fff;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      input {
        padding: 6px 8px;
        border: 1px solid #d4d4d8;
        border-radius: 6px;
        font-variant-numeric: tabular-nums;
        letter-spacing: 2px;
        width: 100px;
      }
      .qua-row {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .qua-message {
        display: block;
        margin-top: 8px;
        color: #52525b;
        min-height: 1.2em;
      }
    </style>
  </head>
  <body>
    <h1>QUA</h1>

    <section>
      <h2>Micrófono</h2>
      <p class="qua-hint">
        Necesario una sola vez: el offscreen document no puede pedir este permiso por su cuenta
        (§5.4), así que se otorga acá y queda para siempre en este origen.
      </p>
      <div class="qua-row">
        <button id="qua-mic-button" type="button">Dar permiso de micrófono</button>
        <span id="qua-mic-status">Consultando…</span>
      </div>
      <span id="qua-mic-message" class="qua-message"></span>
    </section>

    <section>
      <h2>Emparejar con el daemon</h2>
      <p class="qua-hint">Ingresá el código de 6 dígitos que muestra la app QUA.</p>
      <form id="qua-pair-form" class="qua-row">
        <input id="qua-pair-input" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="000000" />
        <button id="qua-pair-button" type="submit">Conectar</button>
      </form>
      <span id="qua-pair-message" class="qua-message"></span>
    </section>

    <script type="module" src="./index.ts"></script>
  </body>
</html>

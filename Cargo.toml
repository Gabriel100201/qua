[workspace]
resolver = "2"
members = [
  "crates/qua-protocol",
  "crates/qua-core",
  "crates/quad",
  "crates/qua-mcp",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
authors = ["Gabriel Funes"]

[workspace.dependencies]
qua-protocol = { path = "crates/qua-protocol" }
qua-core = { path = "crates/qua-core" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
rusqlite = { version = "0.32", features = ["bundled"] }
anyhow = "1"
thiserror = "2"

[package]
name = "qua-wasm"
description = "qua-core compilado a wasm32 para el modo local de la extensión (D-L1-01): segmentador, correlador y render."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
qua-core = { workspace = true, default-features = false }
qua-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
image.workspace = true
wasm-bindgen = "0.2"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
